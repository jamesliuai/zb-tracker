<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ZBLL Tracker</title>
    <meta name="description" content="Track your progress through all 472 ZBLL cases and the 21 PLLs, with algorithms, AUF and recognition notes for each one, and a trainer to drill them." />
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314171d'/%3E%3Cg%3E%3Crect x='6' y='6' width='9' height='9' rx='2.4' fill='%23ee3842'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2.4' fill='%23f29d34'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2.4' fill='%23007efd'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2.4' fill='%23ffd43a'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      try {
        var t = (JSON.parse(localStorage.getItem('zbll-tracker') || '{}').prefs || {}).theme
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
